name: Verify SocketPreflight source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  MOONBIT_VERSION: '1.0.0-rc1+3c0520448'

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.13.0'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: ${{ env.MOONBIT_VERSION }}
          core-version: ${{ env.MOONBIT_VERSION }}
      - name: Verify the MoonBit compiler version
        shell: bash
        run: |
          moon version --all
          actual="$(moonc -v)"
          if [[ "${actual%% *}" != "v$MOONBIT_VERSION" ]]; then
            printf 'Expected moonc v%s, found %s\n' "$MOONBIT_VERSION" "$actual" >&2
            exit 1
          fi
      - run: python -X utf8 scripts/verify_source.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: source-verification-${{ runner.os }}
          path: _build/source-validation/*.json
          if-no-files-found: ignore
